<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلوت عشوائي - Stake</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #f5c842;
    --gold-dark: #c9a020;
    --bg: #0d0d0d;
    --card: #161616;
    --card2: #1e1e1e;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #888;
    --green: #00c853;
    --red: #ff4444;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 28px;
  }
  .header .logo {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .header h1 {
    font-size: 30px;
    font-weight: 900;
    color: #fff;
    line-height: 1.1;
  }
  .header .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
  }

  /* Stats */
  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    max-width: 480px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    text-align: center;
  }
  .stat-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .stat-val {
    font-size: 28px;
    font-weight: 900;
    color: var(--gold);
  }

  /* Spin Button */
  .spin-btn {
    display: block;
    width: 100%;
    max-width: 480px;
    padding: 18px;
    font-family: 'Cairo', sans-serif;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    border-radius: 16px;
    border: none;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
    color: #0d0d0d;
    margin-bottom: 20px;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    box-shadow: 0 4px 20px rgba(245,200,66,0.3);
  }
  .spin-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(245,200,66,0.45);
  }
  .spin-btn:active:not(:disabled) { transform: scale(0.97); }
  .spin-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    background: #444;
    box-shadow: none;
  }

  /* Result Card */
  .result-card {
    background: var(--card);
    border: 1px solid var(--gold-dark);
    border-radius: 20px;
    padding: 28px 24px;
    width: 100%;
    max-width: 480px;
    margin-bottom: 20px;
    display: none;
    text-align: center;
    box-shadow: 0 0 30px rgba(245,200,66,0.08);
  }
  .result-card.show { display: block; animation: popIn 0.3s ease; }
  @keyframes popIn {
    0% { transform: scale(0.94); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .result-label {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .result-name {
    font-size: 26px;
    font-weight: 900;
    color: #fff;
    line-height: 1.2;
  }
  .session-note {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  @keyframes pulse { from { opacity: 1; } to { opacity: 0.3; } }
  .spinning { animation: pulse 0.3s infinite alternate; color: var(--gold); }

  /* History */
  .recent-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    width: 100%;
    max-width: 480px;
    display: none;
  }
  .recent-card.show { display: block; }
  .recent-title {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 14px;
    font-weight: 600;
  }
  .recent-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    color: var(--text);
    font-weight: 600;
  }
  .recent-item:last-child { border-bottom: none; }
  .recent-num {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--card2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--muted);
    flex-shrink: 0;
  }

  .bottom-note {
    margin-top: 16px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>

<button class="spin-btn" id="spin-btn" disabled>🎲 اختر سلوت عشوائي</button>

let sessionUsed = new Set();
let history = [];

function getRandom(slots, used) {
  const available = slots.filter(s => !used.has(s.name));
  if (available.length === 0) return null;
  return available[Math.floor(Math.random() * available.length)];
}

function updateStats() {
  document.getElementById('total-games').textContent = SLOTS_RAW.length;
  document.getElementById('session-count').textContent = sessionUsed.size;
  document.getElementById('stats-row').style.display = '';
  const avail = SLOTS_RAW.filter(s => !sessionUsed.has(s.name)).length;
  const btn = document.getElementById('spin-btn');
  if (avail === 0) {
    btn.disabled = true;
    btn.textContent = '✅ تم عرض كل الألعاب!';
  } else {
    btn.disabled = false;
    btn.textContent = '🎲 اختر سلوت عشوائي';
  }
}

function updateHistory() {
  const list = document.getElementById('recent-list');
  if (history.length === 0) { list.classList.remove('show'); return; }
  list.classList.add('show');
  document.getElementById('recent-items').innerHTML = history.slice(-5).reverse()
    .map((s, i) => `<div class="recent-item"><span class="recent-num">${i+1}</span>${s.name}</div>`).join('');
}

function spin() {
  const btn = document.getElementById('spin-btn');
  btn.disabled = true;
  const card = document.getElementById('result-card');
  const nameEl = document.getElementById('result-name');
  nameEl.className = 'result-name spinning';
  card.className = 'result-card show';

  let flips = 0;
  const interval = setInterval(() => {
    nameEl.textContent = SLOTS_RAW[Math.floor(Math.random() * SLOTS_RAW.length)].name;
    flips++;
    if (flips >= 14) {
      clearInterval(interval);
      const chosen = getRandom(SLOTS_RAW, sessionUsed);
      if (!chosen) { updateStats(); return; }
      nameEl.className = 'result-name';
      nameEl.textContent = chosen.name;
      sessionUsed.add(chosen.name);
      history.push(chosen);
      updateStats();
      updateHistory();
    }
  }, 75);
}

document.getElementById('spin-btn').addEventListener('click', spin);
document.getElementById('load-status').textContent = 'آخر تحديث: ' + new Date().toLocaleTimeString('ar');
document.getElementById('refresh-note').textContent = SLOTS_RAW.length + ' لعبة متاحة';
