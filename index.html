
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.container { padding: 1.5rem 1rem; max-width: 680px; font-family: var(--font-sans); }
.header { text-align: center; margin-bottom: 1.5rem; }
.header h2 { font-size: 20px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 4px; }
.header p { font-size: 13px; color: var(--color-text-secondary); }
.stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
.stat-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px 12px; }
.stat-label { font-size: 11px; color: var(--color-text-tertiary); margin-bottom: 2px; }
.stat-val { font-size: 17px; font-weight: 500; color: var(--color-text-primary); }
.spin-btn { display: block; width: 100%; padding: 14px; font-size: 17px; font-weight: 500; cursor: pointer; border-radius: var(--border-radius-lg); border: 2px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); transition: background 0.15s, transform 0.1s; margin-bottom: 1.5rem; }
.spin-btn:hover { background: var(--color-background-secondary); }
.spin-btn:active { transform: scale(0.98); }
.spin-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.result-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.5rem 1.25rem; margin-bottom: 1rem; display: none; text-align: center; }
.result-card.show { display: block; }
.result-label { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
.result-name { font-size: 28px; font-weight: 500; color: var(--color-text-primary); }
.session-note { margin-top: 10px; font-size: 12px; color: var(--color-text-tertiary); }
.recent-list { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; }
.recent-title { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 10px; font-weight: 500; }
.recent-item { padding: 7px 0; border-bottom: 0.5px solid var(--color-border-tertiary); font-size: 13px; color: var(--color-text-primary); }
.recent-item:last-child { border-bottom: none; }
.refresh-note { text-align: center; font-size: 11px; color: var(--color-text-tertiary); margin-top: 1rem; }
.spinning { animation: pulse 0.4s infinite alternate; }
@keyframes pulse { from { opacity: 1; } to { opacity: 0.4; } }
</style>

let sessionUsed = new Set();
let history = [];

function weightedRandom(slots, used) {
  const available = slots.filter(s => !used.has(s.name));
  if (available.length === 0) return null;
  return available[Math.floor(Math.random() * available.length)];
}

function updateStats() {
  document.getElementById('total-games').textContent = SLOTS_RAW.length;
  document.getElementById('session-count').textContent = sessionUsed.size;
  document.getElementById('stats-row').style.display = '';
  const avail = SLOTS_RAW.filter(s => !sessionUsed.has(s.name)).length;
  const btn = document.getElementById('spin-btn');
  if (avail === 0) {
    btn.disabled = true;
    btn.innerHTML = 'تم عرض كل الألعاب في هذه الجلسة!';
  } else {
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-player-play" aria-hidden="true"></i> اختر سلوت عشوائي';
  }
}

function updateHistory() {
  if (history.length === 0) { document.getElementById('recent-list').style.display = 'none'; return; }
  document.getElementById('recent-list').style.display = '';
  document.getElementById('recent-items').innerHTML = history.slice(-5).reverse()
    .map(s => `<div class="recent-item">${s.name}</div>`).join('');
}

function spin() {
  document.getElementById('spin-btn').disabled = true;
  const card = document.getElementById('result-card');
  const nameEl = document.getElementById('result-name');
  nameEl.className = 'result-name spinning';

  let flips = 0;
  const interval = setInterval(() => {
    nameEl.textContent = SLOTS_RAW[Math.floor(Math.random() * SLOTS_RAW.length)].name;
    flips++;
    if (flips >= 12) {
      clearInterval(interval);
      const chosen = weightedRandom(SLOTS_RAW, sessionUsed);
      if (!chosen) { updateStats(); return; }
      nameEl.className = 'result-name';
      nameEl.textContent = chosen.name;
      sessionUsed.add(chosen.name);
      history.push(chosen);
      card.className = 'result-card show';
      updateStats();
      updateHistory();
    }
  }, 80);
}

document.getElementById('spin-btn').addEventListener('click', spin);

document.getElementById('load-status').textContent = 'آخر تحديث: ' + new Date().toLocaleTimeString('ar');
document.getElementById('refresh-note').textContent = SLOTS_RAW.length + ' لعبة متاحة';
